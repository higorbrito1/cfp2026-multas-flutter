name: Verificar fontes oficiais do CTB e MBFT

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar páginas oficiais
        run: python scripts/update_official_sources.py

      - name: Salvar manifesto atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/database-metadata.json
          git diff --cached --quiet || git commit -m "chore: verificar fontes oficiais do CTB e MBFT"
          git push
